<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách khu vực đang cấu hình – SmartBuilding</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/operator.css">
  <link rel="stylesheet" href="../css/manager.css">
</head>
<body data-page="zones">
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="content-area" id="main">
      <section class="grid-cols-3" id="stats" aria-label="Thống kê"></section>
      <section class="card section"><h2 class="card-title" style="margin-bottom:16px">Thêm mới / sửa khu vực vật lý</h2><form id="af" class="form-row" novalidate></form></section>
      <section class="card section"><div class="card-header"><h2 class="card-title">Danh sách khu vực đang cấu hình</h2><input class="form-control" id="q" placeholder="Tìm kiếm…" aria-label="Tìm kiếm" style="max-width:260px"></div><div class="table-responsive"><table class="custom-table"><thead id="head"></thead><tbody id="rows"></tbody></table></div></section>
      <section class="card section"><h2 class="card-title">Tạm dừng hiển thị khu vực</h2><p class="muted">Khóa một khu vực để ẩn khỏi KPI và so sánh. Mở khóa để hiển thị lại.</p></section>
    </main>
  </div>
</div>
<script src="../js/data.js"></script>
<script src="../js/manager-data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/manager.js"></script>
</body>
</html>
