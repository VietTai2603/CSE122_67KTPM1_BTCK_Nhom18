<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài đặt tài khoản – SmartBuilding</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/settings.css">
</head>
<body style="display:block">
  <main class="shared-shell"><section class="shared-card shared-form-card" aria-labelledby="title">
    <a class="shared-back" href="profile.html">← Hồ sơ cá nhân</a>
    <div class="shared-brand"><span class="brand-icon">⚡</span><span><strong class="brand-title">SmartBuilding</strong><small class="brand-sub">BTL-36 • CSE122</small></span></div>
    <h1 id="title">Cài đặt tài khoản</h1><p class="shared-lead">Đổi mật khẩu cho tài khoản thử nghiệm trên thiết bị này.</p>
    <div id="notice" class="shared-notice" role="status" aria-live="polite"></div>
    <form id="settingsForm">
      <label class="shared-label" for="currentPassword">Mật khẩu hiện tại</label><input class="form-control" id="currentPassword" type="password" autocomplete="current-password" required>
      <label class="shared-label" for="newPassword">Mật khẩu mới</label><input class="form-control" id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
      <label class="shared-label" for="confirmPassword">Xác nhận mật khẩu mới</label><input class="form-control" id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      <button class="btn btn-primary shared-submit" type="submit">Cập nhật mật khẩu</button>
    </form>
    <p class="shared-foot"><a href="profile.html">Quay lại hồ sơ</a></p>
  </section></main><script src="../javascript/data.js"></script><script src="../javascript/manager-data.js"></script><script src="../javascript/main.js"></script><script src="../javascript/settings.js"></script>
</body>
</html>
