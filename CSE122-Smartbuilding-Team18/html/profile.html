<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<body style="display:block">
  <main class="shared-shell"><section class="shared-card shared-form-card" aria-labelledby="title">

      <button class="btn btn-primary shared-submit" type="submit">Lưu thay đổi</button>

    <p class="shared-foot"><a href="settings.html">Cài đặt tài khoản</a> · <a href="login.html" id="logout">Đăng xuất</a></p>
  </section></main><script src="../javascript/data.js"></script><script src="../javascript/manager-data.js"></script><script src="../javascript/main.js"></script><script src="../javascript/shared-pages.js"></script>
