<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saving Actions - SmartBuilding (Operator)</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/operator.css">
<link rel="stylesheet" href="../css/inline-overrides.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"><h1 class="page-title">Hành động tiết kiệm</h1></header>
    <main class="content-area" id="main">
      <section class="grid-cols-3" id="stats"></section>

      <section class="card section">
        <div class="card-header">
          <h2 class="card-title">🤖 AI-2 Saving Recommendation</h2>
          <button class="btn btn-secondary btn-sm" id="failBtn" onclick="toggleAiFail('failBtn')">Mô phỏng AI lỗi: TẮT</button>
        </div>
        <div class="toolbar">
          <select class="form-control" id="aiZone" aria-label="Khu vực"></select>
          <input class="form-control" id="aiTemp" type="number" value="33" placeholder="Nhiệt độ ngoài trời °C" aria-label="Nhiệt độ ngoài trời">
          <button class="btn btn-ai" onclick="askAI()">Gợi ý tiết kiệm</button>
        </div>
        <p class="form-error-msg page-style-operator-saving-actions-001" id="aiErr"></p>
        <div id="aiOut"></div>
      </section>

      <div class="split">
        <section>
          <h2 class="card-title section">Danh sách tác vụ tối ưu</h2>
          <div id="list"></div>
        </section>

        <section class="card section">
          <h2 class="card-title page-style-operator-saving-actions-001">Thêm / sửa tác vụ tiết kiệm</h2>
          <form id="af" onsubmit="saveAction(event)" novalidate>
            <div class="form-group"><label class="form-label" for="title">Tên tác vụ</label><input class="form-control" id="title" placeholder="VD: Tắt đèn hành lang"><div class="form-error-msg"></div></div>
            <div class="form-group"><label class="form-label" for="zone">Khu vực áp dụng</label><select class="form-control" id="zone"></select><div class="form-error-msg"></div></div>
            <div class="form-group"><label class="form-label" for="saving">Tiết kiệm dự kiến (kWh)</label><input class="form-control" id="saving" type="number" min="1" placeholder="0"><div class="form-error-msg"></div></div>
            <div class="form-group"><label class="form-label" for="progress">Tiến độ (%)</label><input class="form-control" id="progress" type="number" min="0" max="100" value="0"><div class="form-error-msg"></div></div>
            <div class="form-group"><label class="form-label" for="status">Trạng thái</label><select class="form-control" id="status"><option value="scheduled">Đã lên lịch</option><option value="active">Đang chạy</option><option value="completed">Hoàn thành</option></select><div class="form-error-msg"></div></div>
            <button class="btn btn-primary" id="submitBtn">Lưu tác vụ</button>
            <button type="button" class="btn btn-secondary" id="cancelBtn" hidden onclick="resetForm()">Hủy sửa</button>
          </form>
        </section>
      </div>
    </main>
  </div>
</div>
<script src="../javascript/data.js"></script>
<script src="../javascript/main.js"></script>
<script src="../javascript/operator-saving-actions.js"></script>
<footer class="app-footer">
  <p>© 2026 SmartBuilding CSE122 • Nhóm 18 • Đề tài BTL-36</p>
</footer>
<script src="../javascript/role-switcher.js"></script>
</body>
</html>
