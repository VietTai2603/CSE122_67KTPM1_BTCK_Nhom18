<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập – SmartBuilding (BTL-36)</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/login.css">
<link rel="stylesheet" href="../css/inline-overrides.css">
</head>
<body class="page-style-login-001">
  <main class="auth-wrap">
    <section class="card auth-card" aria-labelledby="loginTitle">
      <div class="auth-brand">
        <div class="brand-icon" aria-hidden="true">⚡</div>
        <div><div class="brand-title">SmartBuilding</div><div class="brand-sub">BTL-36 • CSE122</div></div>
      </div>
      <h1 id="loginTitle" class="page-style-login-002">Đăng nhập hệ thống</h1>
      <p class="page-style-login-003">Chọn tài khoản theo vai trò để trải nghiệm giao diện tương ứng.</p>

      <div id="msg" class="auth-msg" role="alert"></div>

      <form id="lf" onsubmit="login(event)" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" type="email" placeholder="ten@smartbuilding.vn">
          <div class="form-error-msg"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <div class="pw-wrap">
            <input class="form-control" id="password" type="password" placeholder="Nhập mật khẩu">
            <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePassword()">Hiện</button>
          </div>
          <div class="form-error-msg"></div>
        </div>
        <button class="btn btn-primary page-style-login-004" id="submitBtn"><span class="spinner"></span><span id="submitText">Đăng nhập</span></button>
      </form>

      <p class="page-style-login-005"><a href="forgot-password.html" class="page-style-login-006">Quên mật khẩu?</a></p>
      <div class="demo">
        <strong class="page-style-login-007">Chuyển vai trò thử nghiệm</strong>
        <div class="page-style-login-008">Bấm để điền sẵn tài khoản. Mật khẩu chung: <code>123456</code></div>
        <div class="demo-grid" id="demo"></div>
      </div>
      <p class="page-style-login-009"><a href="../index.html" class="page-style-login-010">&larr; Về trang chủ Portal</a></p>
    </section>
  </main>
<script src="../javascript/data.js"></script>
<script src="../javascript/manager-data.js"></script>
<script src="../javascript/main.js"></script>
<script src="../javascript/login.js"></script>
<footer class="app-footer">
  <p>© 2026 SmartBuilding CSE122 • Nhóm 18 • Đề tài BTL-36</p>
</footer>
<script src="../javascript/role-switcher.js"></script>
</body>
</html>
