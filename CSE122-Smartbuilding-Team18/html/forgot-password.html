<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi phục mật khẩu – SmartBuilding</title>
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/shared-pages.css">
</head>
<body style="display:block">
  <main class="shared-shell"><section class="shared-card shared-form-card" aria-labelledby="title">
    <a class="shared-back" href="login.html">← Đăng nhập</a>
    <div class="shared-brand"><span class="brand-icon">⚡</span><span><strong class="brand-title">SmartBuilding</strong><small class="brand-sub">BTL-36 • CSE122</small></span></div>
    <h1 id="title">Khôi phục mật khẩu</h1><p class="shared-lead">Nhập email tài khoản, sau đó tạo mật khẩu mới để tiếp tục đăng nhập.</p>
    <div id="notice" class="shared-notice" role="status" aria-live="polite"></div>
    <form id="forgotForm">
      <label class="shared-label" for="email">Email tài khoản</label><input class="form-control" id="email" type="email" placeholder="ten@smartbuilding.vn" autocomplete="email" required>
      <button class="btn btn-primary shared-submit" type="submit">Tiếp tục</button>
    </form>
    <form id="resetForm" hidden>
      <label class="shared-label" for="newPassword">Mật khẩu mới</label><input class="form-control" id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
      <label class="shared-label" for="confirmPassword">Xác nhận mật khẩu mới</label><input class="form-control" id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      <button class="btn btn-primary shared-submit" type="submit">Lưu mật khẩu mới</button>
    </form>
    <p class="shared-foot"><a href="login.html">Quay lại đăng nhập</a></p>
  </section></main><script src="../javascript/data.js"></script><script src="../javascript/manager-data.js"></script><script src="../javascript/main.js"></script><script src="../javascript/shared-pages.js"></script>
</body>
</html>
