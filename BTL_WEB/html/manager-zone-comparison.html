<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone Comparison – SmartBuilding</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/operator.css">
  <link rel="stylesheet" href="../css/manager.css">
</head>
<body data-page="compare">
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="content-area" id="main">
      <section class="card"><div class="toolbar"><label class="form-label" for="fz" style="margin:0">Khu vực</label><select class="form-control" id="fz"></select><label class="form-label" for="fp" style="margin:0">Kỳ so sánh</label><select class="form-control" id="fp"><option value="0">Tháng này và tháng trước</option><option value="1">Tháng này và cùng kỳ năm trước</option></select><button class="btn btn-primary" id="apply">Áp dụng</button></div></section>
      <section class="card section"><h2 class="card-title" style="margin-bottom:12px">Biểu đồ chỉ tiêu tiêu thụ giữa các khu vực</h2><div id="cmpChart"></div></section>
      <section class="card section"><h2 class="card-title" style="margin-bottom:12px">Bảng phân tích chênh lệch hiệu suất</h2><div class="table-responsive"><table class="custom-table"><thead><tr><th>Khu vực</th><th>Kỳ này (kWh)</th><th>Kỳ trước (kWh)</th><th>Biến động</th></tr></thead><tbody id="cmpRows"></tbody></table></div></section>
      <section class="card section"><div class="card-header"><h2 class="card-title">🤖 AI-3 What-If Simulator</h2><button class="btn btn-secondary btn-sm" id="fail"></button></div>
        <div class="toolbar"><select class="form-control" id="wz" aria-label="Khu vực mô phỏng"></select><label for="wp" class="form-label" style="margin:0">Giảm phụ tải</label><input type="range" id="wp" min="1" max="50" value="10"><strong id="wv"></strong><button class="btn btn-ai" id="wgo">Chạy mô phỏng</button></div>
        <p class="form-error-msg" id="werr" style="display:block"></p><div id="aiOut" aria-live="polite"></div></section>
      <section class="section"><h2 class="card-title" style="margin-bottom:12px">Kịch bản đã lưu</h2><div id="sc"></div></section>
    </main>
  </div>
</div>
<script src="../javascript/data.js"></script>
<script src="../javascript/manager-data.js"></script>
<script src="../javascript/main.js"></script>
<script src="../javascript/manager-zone-comparison.js"></script>
</body>
</html>
