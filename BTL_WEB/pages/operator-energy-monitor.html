<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy Monitor – SmartBuilding (Operator)</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/operator.css">
</head>
<body data-page="monitor">
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="content-area" id="main">
      <section class="grid-cols-4" id="stats" aria-label="Chỉ số nhanh"></section>
      <section class="section" aria-label="Bản đồ khu vực"><h2 class="card-title" style="margin-bottom:16px">Bản đồ trạng thái khu vực</h2><div class="grid-cols-4" id="zoneGrid"></div></section>
      <section class="card section"><div class="card-header"><h2 class="card-title">Biểu đồ phụ tải 24 giờ (kW)</h2><span class="badge badge-pending">Nét đứt: baseline</span></div><div id="chart"></div></section>
      <section class="card section"><div class="card-header"><h2 class="card-title">Bảng phân bổ năng lượng chi tiết</h2>
        <div class="toolbar"><input class="form-control" id="q" placeholder="Tìm khu vực…" aria-label="Tìm khu vực"><select class="form-control" id="fs" aria-label="Lọc trạng thái"><option value="">Tất cả trạng thái</option><option>Bình thường</option><option>Peak load</option><option>Quá tải</option></select></div></div>
        <div class="table-responsive"><table class="custom-table"><thead><tr><th>Khu vực</th><th>Tầng</th><th>Loại tải</th><th>Công suất thiết kế</th><th>Tải hiện tại</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></div></section>
    </main>
  </div>
</div>
<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script src="../js/operator.js"></script>
</body>
</html>
