<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energy KPIs – SmartBuilding (Manager)</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/operator.css">
  <link rel="stylesheet" href="../css/manager-energy-kpis.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>
    <main class="content-area" id="main">
      <section class="grid-cols-4" id="stats"></section>

      <section class="card section">
        <div class="card-header">
          <h2 class="card-title">Mức sử dụng ngân sách điện tháng</h2>
          <span class="badge badge-investigating" id="budgetText"></span>
        </div>
        <div class="progress"><i id="budgetBar" style="width:0; background:var(--emerald-500)"></i></div>
      </section>

      <section class="card section">
        <div class="card-header">
          <h2 class="card-title">Xu hướng 12 tháng (nghìn kWh)</h2>
          <span class="stat-label"><span class="v-green">■</span> Thực tế &nbsp; <span class="v-sky">■</span> Mục tiêu</span>
        </div>
        <div class="trend" id="trend"></div>
      </section>

      <section class="card section">
        <h2 class="card-title" style="margin-bottom:16px">Chỉ tiêu KPI theo khu vực</h2>
        <div class="table-responsive">
          <table class="custom-table">
            <thead><tr><th>Khu vực</th><th>Mục tiêu tháng (kWh)</th><th>Thực tế tháng này (kWh)</th><th>Đánh giá</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="../javascript/data.js"></script>
<script src="../javascript/manager-data.js"></script>
<script src="../javascript/main.js"></script>
<script src="../javascript/manager-energy-kpis.js"></script>
</body>
</html>
